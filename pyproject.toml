[project]
name = "honest-model"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "burhan noori", email = "burhan.batawala@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "kaggle>=2.2.4",
    "numpy>=2.5.2",
    "pandas>=3.0.5",
    "pydantic>=2.13.4",
    "pyyaml>=6.0.3",
]

[project.scripts]
honest-model = "honest_model:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff>=0.16.4",
]

[tool.ruff]
    line-length = 88
    target-version = "py312"

    [tool.ruff.lint]
    select = ["E", "F", "I", "UP", "B"]
    ignore = []

    [tool.pytest.ini_options]
    testpaths = ["tests"]
    pythonpath = ["src"]
